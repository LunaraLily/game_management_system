{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white rounded-lg shadow p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">游戏信息管理系统</h1>
    <p class="text-gray-500 text-sm text-center mb-6">请登录后使用</p>

    {# 显示 messages：注册成功 / 退出 / 密码错误 都在这 #}
    {% if messages %}
        {% for m in messages %}
            <div class="mb-4 p-3 rounded text-sm
                {% if m.tags == 'success' %}bg-green-50 text-green-700
                {% elif m.tags == 'error' %}bg-red-50 text-red-600
                {% else %}bg-blue-50 text-blue-700{% endif %}">
                {{ m }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md
                          focus:outline-none focus:ring-2 focus:ring-blue-400/50">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md
                          focus:outline-none focus:ring-2 focus:ring-blue-400/50">
        </div>

        <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg transition">
            登 录
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        还没有账号？
        <a href="{% url 'users:register' %}" class="text-blue-500 hover:underline font-medium">立即注册</a>
    </p>
</div>
</body>
</html>
